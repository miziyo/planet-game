<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>행성 시뮬레이션 (3D)</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: #fff;
            background-color: #111;
        }
        .main-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #simulationCanvas {
            background-color: #000;
            width: 50%; /* Initial width */
        }
        .resizer {
            flex-shrink: 0;
            background: #444;
            width: 5px;
            cursor: col-resize;
            z-index: 10;
        }
        .controls-panel {
            width: 50%; /* Initial width */
            padding: 20px;
            overflow-y: auto;
            background-color: #1a1a1a;
            box-shadow: -5px 0 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h2, h3 {
            margin-top: 0;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            color: #eee;
        }
        .control-group {
            margin-bottom: 25px;
            background-color: #252525;
            padding: 15px;
            border-radius: 8px;
        }
        #planet-list-container {
            max-height: 30vh;
            overflow-y: auto;
        }
        .planet-item {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background-color: #333;
            border-radius: 4px;
            border-left: 5px solid transparent;
            transition: background-color 0.2s, border-color 0.2s;
            cursor: pointer;
        }
        .planet-item.focused {
            border-left-color: #3498db;
            background-color: #404040;
        }
        .planet-color-swatch {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 15px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .planet-main-info {
            display: flex;
            align-items: center;
            grid-column: 1 / 2;
        }
        .planet-details {
            grid-column: 1 / 3;
            font-size: 0.8em;
            color: #ccc;
            padding-left: 35px; /* Align with text */
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .planet-actions {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
        }
        .planet-item span {
            font-size: 0.95em;
        }
        .planet-actions button {
            padding: 5px 8px;
            margin-left: 5px;
            border: none;
            background-color: #555;
            color: #fff;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
        }
        .planet-actions button:hover {
            background-color: #666;
        }
        .remove-btn {
            background-color: #c0392b !important;
        }
        .remove-btn:hover {
            background-color: #e74c3c !important;
        }

        /* Time Control Styles */
        .time-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .time-controls button {
            padding: 8px 12px;
            font-size: 1em;
            background-color: #444;
            border: none;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }
        .time-controls button:hover {
            background-color: #555;
        }
        #time-scale-display {
            font-size: 1.1em;
            font-weight: bold;
            color: #3498db;
            min-width: 50px;
            text-align: center;
        }

        /* Form Styles */
        #add-planet-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .form-row label {
            width: 100%;
            font-size: 0.9em;
            color: #ccc;
            margin-bottom: 2px;
        }
        .form-row input {
            flex-grow: 1;
            padding: 8px;
            background-color: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
            width: 40%; /* Ensure two inputs fit on one line */
            box-sizing: border-box;
        }
        #add-planet-form button[type="submit"] {
            padding: 10px;
            border: none;
            background-color: #27ae60;
            color: #fff;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1em;
        }
        #add-planet-form button[type="submit"]:hover {
            background-color: #2ecc71;
        }

        /* Responsive Layout */
        @media (max-width: 800px) {
            .main-container {
                flex-direction: column;
            }
            .controls-panel {
                width: 100%;
                height: 50vh;
                min-width: unset;
                border-left: none;
                border-top: 2px solid #333;
                box-sizing: border-box;
            }
            #simulationCanvas {
                height: 50vh;
                flex-grow: 0;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <canvas id="simulationCanvas"></canvas>
        <div class="resizer" id="resizer"></div>
        <div class="controls-panel">
            <h2>컨트롤 패널</h2>

            <div class="control-group">
                <h3>시간 제어</h3>
                <div class="time-controls">
                    <button id="time-slower-btn">⏪</button>
                    <button id="time-pause-btn">⏸️</button>
                    <button id="time-play-btn">▶️</button>
                    <button id="time-faster-btn">⏩</button>
                    <span id="time-scale-display">x1.0</span>
                </div>
            </div>

            <div class="control-group">
                <h3>행성 목록</h3>
                <div id="planet-list-container">
                    <!-- 행성 목록이 여기에 동적으로 추가됩니다. -->
                </div>
            </div>

            <div class="control-group">
                <h3>새 행성 추가</h3>
                <div id="add-planet-form-container">
                    <!-- 행성 추가 폼이 여기에 동적으로 추가됩니다. -->
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="simulation.js"></script>
</body>
</html>
