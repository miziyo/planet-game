<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>행성 시뮬레이션 (2D SVG)</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: #fff;
            background-color: #111;
        }
        .main-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #simulation-svg {
            background-color: #000;
            width: 50%; /* Initial width */
            height: 100%;
        }
        .resizer {
            flex-shrink: 0;
            background: #444;
            width: 5px;
            cursor: col-resize;
            z-index: 10;
        }
        .controls-panel {
            width: 50%; /* Initial width */
            padding: 20px;
            overflow-y: auto;
            background-color: #1a1a1a;
            box-shadow: -5px 0 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h2, h3 {
            margin-top: 0;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            color: #eee;
        }
        .control-group {
            margin-bottom: 25px;
            background-color: #252525;
            padding: 15px;
            border-radius: 8px;
        }
        #planet-list-container {
            max-height: 30vh;
            overflow-y: auto;
        }
        .planet-item {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background-color: #333;
            border-radius: 4px;
            border-left: 5px solid transparent;
            transition: background-color 0.2s, border-color 0.2s;
            cursor: pointer;
        }
        .planet-item.focused {
            border-left-color: #3498db;
            background-color: #404040;
        }
        .planet-color-swatch {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 15px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .planet-main-info {
            display: flex;
            align-items: center;
            grid-column: 1 / 2;
        }
        .planet-details {
            grid-column: 1 / 3;
            font-size: 0.8em;
            color: #ccc;
            padding-left: 35px;
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .planet-actions {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
        }
        .planet-item span {
            font-size: 0.95em;
        }
        .planet-actions button {
            padding: 5px 8px;
            margin-left: 5px;
            border: none;
            background-color: #555;
            color: #fff;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
        }
        .remove-btn {
            background-color: #c0392b !important;
        }
        .scenario-controls, .time-controls {
            display: flex;
            gap: 10px;
        }
        select, .time-controls button, .scenario-controls button {
            padding: 8px;
            background-color: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
        }
        #time-scale-display {
            font-size: 1.1em;
            font-weight: bold;
            color: #3498db;
            min-width: 50px;
            text-align: center;
            align-self: center;
        }
        #add-planet-form button[type="submit"], .scenario-controls button {
            background-color: #3498db;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <svg id="simulation-svg"></svg>
        <div class="resizer" id="resizer"></div>
        <div class="controls-panel">
            <h2>컨트롤 패널 (2D SVG)</h2>
            <div class="control-group">
                <h3>시나리오 선택</h3>
                <div class="scenario-controls">
                    <select id="scenario-select">
                        <option value="default">기본 태양계</option>
                        <option value="binary_star">쌍성계</option>
                    </select>
                    <button id="load-scenario-btn">불러오기</button>
                </div>
            </div>
            <div class="control-group">
                <h3>시간 제어</h3>
                <div class="time-controls">
                    <button id="time-slower-btn">⏪</button>
                    <button id="time-pause-btn">⏸️</button>
                    <button id="time-play-btn">▶️</button>
                    <button id="time-faster-btn">⏩</button>
                    <span id="time-scale-display">x1.0</span>
                </div>
            </div>
            <div class="control-group">
                <h3>행성 목록</h3>
                <div id="planet-list-container"></div>
            </div>
            <div class="control-group">
                <h3>새 행성 추가</h3>
                <div id="add-planet-form-container"></div>
            </div>
        </div>
    </div>
    <script src="simulation.js"></script>
</body>
</html>
